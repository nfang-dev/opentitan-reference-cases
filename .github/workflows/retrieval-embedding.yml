name: Retrieval (embedding model)

# Downloads PyTorch and a model, so it runs only when the retrieval files change, or on request.
on:
  push:
    paths:
      - "retrieval/**"
      - ".github/workflows/retrieval-embedding.yml"
  workflow_dispatch:

# Runs for the same commit on two branches would otherwise publish to the results branch at once.
concurrency:
  group: retrieval-embedding
  cancel-in-progress: false

jobs:
  embedding:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU) and sentence-transformers
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          pip install -r retrieval/requirements-embed.txt
      - name: Fetch OpenTitan documentation at the revision recorded in the queries
        run: ./retrieval/fetch_docs.sh otdocs
      - name: Rank with the embedding model
        run: python retrieval/rank.py --method embedding --opentitan otdocs --out out/embedding.json
      - name: Score next to the committed BM25 results
        run: python retrieval/evaluate.py retrieval/results/bm25.json out/embedding.json --strict
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-results
          path: out/embedding.json
      - name: Publish the results to the retrieval-ci-results branch
        run: |
          cd out
          printf 'Produced by %s/%s/actions/runs/%s\nfrom commit %s on %s.\n' \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            "${{ github.sha }}" "${{ github.ref_name }}" > RUN.md
          git init -q -b retrieval-ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add embedding.json RUN.md
          git commit -q -m "Embedding results from run ${{ github.run_id }} (${{ github.sha }})"
          # GitHub occasionally rejects a ref update with a transient server error; try three times.
          for attempt in 1 2 3; do
            if git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                 retrieval-ci-results; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
