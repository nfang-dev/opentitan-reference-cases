name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  recheck-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenTitan at the revision recorded in the cases
        run: ./tools/fetch_opentitan.sh opentitan
      - name: Re-check all cases
        run: python tools/check_case.py cases/*/case.json --opentitan opentitan
      - name: Real-checkout test
        run: OPENTITAN_DIR=opentitan python -m unittest discover -s tests -v

  retrieval-bm25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenTitan documentation at the revision recorded in the queries
        run: ./retrieval/fetch_docs.sh otdocs
      - name: Check every target passage
        run: python retrieval/check_queries.py --opentitan otdocs
      - name: Re-run BM25 and compare with the committed results
        run: |
          python retrieval/rank.py --method bm25 --opentitan otdocs --out bm25-rerun.json
          diff -u retrieval/results/bm25.json bm25-rerun.json
      - name: Score all committed results
        run: python retrieval/evaluate.py retrieval/results/*.json --strict
