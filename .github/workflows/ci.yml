name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  recheck-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenTitan at the revision recorded in the cases
        run: ./tools/fetch_opentitan.sh opentitan
      - name: Re-check all cases
        run: python tools/check_case.py cases/*/case.json --opentitan opentitan
      - name: Real-checkout test
        run: OPENTITAN_DIR=opentitan python -m unittest discover -s tests -v

  retrieval-bm25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenTitan documentation at the current and the earlier revision
        run: |
          ./retrieval/fetch_docs.sh otdocs
          ./retrieval/fetch_docs.sh otdocs-earlier earlier
      - name: Check every target and outdated passage
        run: |
          python retrieval/check_queries.py --opentitan otdocs
          python retrieval/check_queries.py --queries retrieval/queries_heldout.json --opentitan otdocs
          python retrieval/check_queries.py --queries retrieval/queries.json \
            --queries retrieval/queries_changed.json --opentitan otdocs --earlier otdocs-earlier
      - name: Re-run BM25 and compare with the committed results
        run: |
          python retrieval/rank.py --method bm25 --opentitan otdocs --out bm25-rerun.json
          diff -u retrieval/results/bm25.json bm25-rerun.json
          python retrieval/rank.py --method bm25 --queries retrieval/queries.json \
            --queries retrieval/queries_changed.json --opentitan otdocs --earlier otdocs-earlier \
            --out bm25-two-rerun.json
          diff -u retrieval/results/two_revisions/bm25.json bm25-two-rerun.json
          python retrieval/rank.py --method bm25 --queries retrieval/queries.json \
            --queries retrieval/queries_changed.json --opentitan otdocs --earlier otdocs-earlier \
            --earlier-last --out bm25-revision-rerun.json
          diff -u retrieval/results/two_revisions/bm25_revision.json bm25-revision-rerun.json
          python retrieval/rank.py --method bm25 --queries retrieval/queries.json \
            --queries retrieval/queries_heldout.json --opentitan otdocs --out bm25-extended-rerun.json
          diff -u retrieval/results/extended/bm25.json bm25-extended-rerun.json
      - name: Score all committed results
        run: |
          python retrieval/evaluate.py retrieval/results/*.json --strict
          python retrieval/evaluate.py retrieval/results/two_revisions/*.json --strict \
            --queries retrieval/queries.json --queries retrieval/queries_changed.json
          python retrieval/evaluate.py retrieval/results/extended/*.json --strict \
            --queries retrieval/queries.json --queries retrieval/queries_heldout.json
